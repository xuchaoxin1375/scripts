<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudflare DNS 操作台</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <h1>Cloudflare DNS 操作台</h1>
  <span class="preset" id="preset-line">预设加载中…</span>
  <span class="hint" id="auth-state" style="color:#b9c4da"></span>
  <button id="btn-auth" type="button">登录</button>
</header>

<nav class="tabs" aria-label="主导航">
  <button type="button" data-tab="browse" class="active">浏览</button>
  <button type="button" data-tab="operate">操作</button>
  <button type="button" data-tab="jobs">任务</button>
</nav>

<main>
  <!-- 浏览 -->
  <section class="tabpage active" id="tab-browse">
    <div class="card">
      <h2>账号配置</h2>
      <div class="row">
        <label class="field">账号配置文件路径
          <input type="text" id="config-path" class="w96" autocomplete="off">
        </label>
        <button class="primary" id="btn-load-accounts" type="button">加载账号</button>
      </div>
      <div class="hint" id="config-preset-hint"></div>
      <div class="status" id="accounts-status"></div>
    </div>

    <div class="card">
      <h2>账号列表 <span class="hint" id="accounts-count"></span></h2>
      <div class="tablewrap short">
        <table class="grid" id="accounts-table">
          <thead><tr><th>账号</th><th>认证</th><th>邮箱</th><th>密钥</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="accounts-pager"></div>
    </div>

    <div class="card">
      <h2>域名浏览</h2>
      <div class="row">
        <label class="field">账号
          <select id="zone-account" class="w64"></select>
        </label>
        <label class="field">域名搜索（实时过滤）
          <input type="text" id="zone-filter" class="w64" placeholder="包含匹配" autocomplete="off">
        </label>
        <label class="field">每页
          <select id="zone-size"><option>20</option><option selected>50</option><option>100</option></select>
        </label>
        <button class="primary" id="btn-load-zones" type="button">加载域名</button>
      </div>
      <div class="status" id="zones-status"></div>
      <div class="tablewrap">
        <table class="grid" id="zones-table">
          <thead><tr><th>域名</th><th>状态</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="zones-pager"></div>
    </div>

    <div class="card">
      <h2>记录浏览</h2>
      <div class="row">
        <label class="field">域名（zone 名）
          <input type="text" id="record-zone" class="w64" list="zone-datalist" autocomplete="off">
          <datalist id="zone-datalist"></datalist>
        </label>
        <label class="field">记录搜索（实时过滤）
          <input type="text" id="record-filter" class="w64" placeholder="名称/内容/类型" autocomplete="off">
        </label>
        <label class="field">每页
          <select id="record-size"><option>20</option><option selected>50</option><option>100</option></select>
        </label>
        <button class="primary" id="btn-load-records" type="button">加载记录</button>
      </div>
      <div class="status" id="records-status"></div>
      <div class="tablewrap">
        <table class="grid" id="records-table">
          <thead><tr><th>类型</th><th>名称</th><th>内容</th><th>TTL</th><th>代理</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="records-pager"></div>
    </div>
  </section>

  <!-- 操作 -->
  <section class="tabpage" id="tab-operate">
    <div class="operate-grid">
      <div class="card formcol">
        <h2>1. 执行账号</h2>
        <div class="row">
          <input type="text" id="acct-search" class="wide" placeholder="搜索账号…" autocomplete="off">
        </div>
        <div class="row" style="margin:8px 0">
          <button class="ghost" id="acct-all" type="button">全选</button>
          <button class="ghost" id="acct-none" type="button">清空</button>
          <span class="hint" id="acct-picked"></span>
        </div>
        <div class="acct-list" id="acct-list"></div>

        <h3>2. 操作模式</h3>
        <div class="mode-cards" id="mode-cards">
          <label><input type="radio" name="mode" value="update" checked>批量更新内容</label>
          <label><input type="radio" name="mode" value="delete_ip">删除指向指定 IP</label>
          <label><input type="radio" name="mode" value="delete_wildcard">删除通配符记录</label>
          <label><input type="radio" name="mode" value="delete_zone">删除域名（高危）</label>
          <label><input type="radio" name="mode" value="set_attrs">设置代理/TTL</label>
          <label><input type="radio" name="mode" value="export">导出备份</label>
        </div>

        <div id="fields-update">
          <label class="field">新内容（更新模式必填）<input type="text" id="f-new" class="wide"></label>
          <label class="field">旧内容过滤（可选）<input type="text" id="f-old" class="wide"></label>
          <label class="field">记录类型
            <select id="f-type"><option value="auto" selected>auto</option><option>A</option><option>AAAA</option><option>CNAME</option><option>ALL</option></select>
          </label>
        </div>
        <div id="fields-delete_ip" hidden>
          <label class="field">目标 IP（必填）<input type="text" id="f-delip" class="wide"></label>
        </div>
        <div id="fields-delete_zone" hidden>
          <label class="field">删域名模式
            <select id="f-zonemode"><option value="dns" selected>dns = 仅清空记录</option><option value="full">full = 彻底删除域名</option></select>
          </label>
        </div>
        <div id="fields-set_attrs" hidden>
          <div class="row">
            <label class="field">代理状态
              <select id="f-proxied"><option value="">不修改</option><option value="on">启用橙云</option><option value="off">关闭</option></select>
            </label>
            <label class="field">TTL（1=自动，空=不修改）
              <input type="text" id="f-ttl" placeholder="如 1 / 300">
            </label>
          </div>
        </div>
        <div id="fields-export" hidden>
          <div class="row">
            <label class="field">导出格式
              <select id="f-fmt"><option value="json" selected>json</option><option value="bind">bind</option></select>
            </label>
          </div>
        </div>

        <h3>3. 范围限定</h3>
        <label class="field">白名单（每行一个域名）<textarea id="f-whitelist" rows="3" class="wide"></textarea></label>
        <label class="field">白名单文件路径（与上栏合并）<input type="text" id="f-whitelist-file" class="wide"></label>
        <label class="field">指定域名（每行一个）<textarea id="f-domains" rows="3" class="wide"></textarea></label>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px">
          <input type="checkbox" id="f-sub" checked>含子域名
        </label>

        <h3>4. 快照 / 导出 / 重跑</h3>
        <label class="field">变更前快照目录（删域名必填，默认自动填预设）<input type="text" id="f-backup" class="wide"></label>
        <label class="field">导出目录<input type="text" id="f-exportdir" class="wide"></label>
        <label class="field">重跑清单 CSV（可选）
          <input type="file" id="f-resume" accept=".csv">
        </label>
        <div class="hint" id="resume-status">重跑清单：未上传</div>

        <details class="adv">
          <summary>高级：速度 / 限速 / 重试</summary>
          <div class="row" style="margin-top:8px">
            <label class="field">速度档位
              <select id="f-speed"><option value="eco" selected>eco</option><option value="balanced">balanced</option><option value="fast">fast</option><option value="turbo">turbo</option></select>
            </label>
            <label class="field">限速范围
              <select id="f-scope"><option value="account" selected>account</option><option value="global">global</option></select>
            </label>
            <label class="field">最大重试次数
              <input type="number" id="f-retries" value="5" min="0" max="20">
            </label>
          </div>
          <div class="hint" id="speed-resolved"></div>
        </details>

        <div class="actionbar">
          <button class="primary" id="btn-preview" type="button">预览（dry-run）</button>
          <button class="danger" id="btn-exec" type="button">正式执行</button>
        </div>
        <div class="status" id="op-status"></div>
      </div>

      <div>
        <div class="card">
          <h2>预览 / 执行结果 <span class="hint" id="preview-count"></span></h2>
          <div class="row">
            <label class="field">搜索（实时过滤）
              <input type="text" id="preview-filter" class="w64" placeholder="账号/域名/状态" autocomplete="off">
            </label>
            <label class="field">每页
              <select id="preview-size"><option>20</option><option selected>50</option><option>100</option></select>
            </label>
          </div>
          <div class="tablewrap">
            <table class="grid" id="preview-table">
              <thead><tr><th>账号</th><th>域名</th><th>类型</th><th>名称</th><th>旧</th><th>新</th><th>状态</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="pager" id="preview-pager"></div>
        </div>
        <div class="card danger-zone" id="delete-confirm-card" hidden>
          <h2>高危操作确认</h2>
          <div class="hint" id="delete-summary"></div>
          <label class="field">请输入 DELETE 以确认
            <input type="text" id="delete-confirm" autocomplete="off">
          </label>
          <div class="row" style="margin-top:8px">
            <button class="danger" id="btn-delete-yes" type="button">确认执行删域名</button>
            <button class="ghost" id="btn-delete-no" type="button">取消</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 任务 -->
  <section class="tabpage" id="tab-jobs">
    <div class="card">
      <h2>任务列表</h2>
      <div class="row">
        <button class="ghost" id="btn-jobs-refresh" type="button">刷新</button>
        <span class="hint">点击一行设为当前任务，下方看三级进度。</span>
      </div>
      <div class="tablewrap short">
        <table class="grid" id="jobs-table">
          <thead><tr><th>任务</th><th>说明</th><th>状态</th><th>账号进度</th><th>未完成</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>当前任务 <span class="hint" id="job-title"></span></h2>
      <div class="bar" style="height:10px"><i id="job-bar"></i></div>
      <div class="hint" id="job-detail"></div>
      <div class="verdict" id="job-verdict">暂无结论</div>
      <h3>账号处理情况</h3>
      <div class="jobscards" id="job-accounts"></div>
      <h3>域名明细</h3>
      <div class="row">
        <label class="field">账号
          <select id="job-zone-account" class="w64"></select>
        </label>
        <label class="field">状态筛选
          <select id="job-zone-state"><option value="">全部</option><option value="done">done</option><option value="error">error</option><option value="pending">pending</option><option value="cancelled">cancelled</option></select>
        </label>
        <label class="field">搜索
          <input type="text" id="job-zone-filter" class="w64" placeholder="域名包含匹配" autocomplete="off">
        </label>
      </div>
      <div class="bar"><i id="zone-bar"></i></div>
      <div class="hint" id="zone-title"></div>
      <div class="tablewrap short">
        <table class="grid" id="job-zones-table">
          <thead><tr><th>域名</th><th>状态</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager" id="job-zones-pager"></div>
      <h3>实时日志</h3>
      <div class="row">
        <label style="font-size:12px"><input type="checkbox" id="log-follow" checked> 跟随滚动</label>
        <button class="ghost" id="btn-job-cancel" type="button">取消当前任务</button>
        <button class="ghost" id="btn-job-csv" type="button">下载失败清单 CSV</button>
      </div>
      <pre class="logs" id="job-logs"></pre>
    </div>
  </section>
</main>

<div id="login-overlay">
  <div class="box">
    <h2 style="margin-top:0">访问口令</h2>
    <input type="password" id="login-pw" class="wide" placeholder="请输入访问口令" style="width:100%">
    <div class="status err" id="login-err"></div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="btn-login" type="button">登录</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
