# 可选：针对可疑 User-Agent 或空 User-Agent 限流(主要,如果ua中指定了 "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)" 这类只有一部分(Mozilla..)但是缺少具体的浏览器版本信息,通常是恶意爬虫,予以禁止(不加入下面的白名单)
# 但是google提交收录的这种特殊ua确实没有具体浏览器版本,可以通过宽松的检查google关键字来放行而不是用googlebot
# 包含对指定bot的限流(429)配置块.
map $http_user_agent $allow_access_ua {
default 0;
# 允许常见浏览器
"~*chrome" 1;
"~*firefox" 1;
"~*safari" 1;
"~*edge" 1;
"~*opera" 1;
# 暂时允许openai(ai搜索)
"~*(openai|gpt)" 1;
# Google
# 允许提交收录的google机器人Google-Site-Verification
"~*Google" 1;


# Bing 相关
"~*bingbot" 1;
"~*adidxbot" 1;
"~*msnbot" 1;
"~*bingpreview" 1;
"~*microsoft.*protocol.*discovery" 1;
"~*bingbot-image" 1;

# 允许 wp定时任务请求
"~*wordpress" 1;
}
# 配置允许访问网站的爬虫ua.
# 以applebot为例,如果这里没有配置Applebot,那么apple的爬虫会因含Safari关键字绕过bot识别,导致只进all.log不进spider.log,且不受bot_limit限制,现纳入bot统计
map $http_user_agent $allow_bot {
default 0;

# 暂时允许openai(ai搜索)
"~*(openai|gptbot)" 1;
# Google
# 允许提交收录的google机器人Google-Site-Verification
"~*Google" 1;

# Bing 相关
"~*bingbot" 1;

# Applebot相关
"~*Applebot" 1;

# 如果有新的bot爬虫要允许访问,添加到这里...

}

# 部分模板会使用这个查询参数,可以酌情关闭
map $args $has_add_to_cart {
    ~*add-to-cart= 1;
    default 0;
}
# 根据是否为爬虫设置不同的限流(429)key
# 分级策略（与 com_js_signed.conf 配套）：google/bing/applebot 暂时放开 bot_limit，
# AI 仍受 bot_limit 约束；Applebot 已移出 bot_limit（见下 $se_unlimited），只受 apple_global 聚合约束。原理：key 为空则该 zone 跳过（nginx 行为）。
# 如需对 google/bing/applebot 重新施加 bot_limit，只需将其从 $se_unlimited 中移除。
map $http_user_agent $se_unlimited {
    default 0;
    ~*google 1;
    ~*bing 1;
    ~*applebot 1; # Applebot 跳过 bot_limit per-IP 层，只留 apple_global 聚合 + DNS 验证
}
map "$allow_bot:$se_unlimited" $bot_limit_key {
    default "";
    1:0 $binary_remote_addr;
}
# Applebot 聚合限流 key（按站分桶：key 含 $server_name，每站独立一个漏桶；站间互不干扰）。
# 原理：key 相同则共享漏桶；非 Applebot 的 key 为空则该 zone 直接跳过（nginx 行为）。
# Applebot-Extended 的 UA 中同样包含 Applebot 子串，一并命中。
map $http_user_agent $apple_key {
    default "";
    ~*applebot "$server_name:applebot";
}

# Applebot 全站封顶 key（常量 key，全机共用一个漏桶；与按站 $apple_key 正交）。
map $http_user_agent $apple_total_key {
    default "";
    ~*applebot "applebot";
}
map $allow_bot $user_limit_key {
    0 $binary_remote_addr;
    1 "";
}


map $http_user_agent $bad_bot {
    default 0;
    ~*(AhrefsBot|MJ12bot|SemrushBot|DotBot|BLEXBot|DataForSeoBot|Scrapy|spider|crawler|python-requests|curl|wget) 1;
}
# 禁止googlebot访问添加购物车的请求
map $http_user_agent $is_googlebot {
    ~*Googlebot 1;
    default 0;
}
map $is_googlebot$args $block_googlebot_cart {
    ~^1.*add-to-cart 1;
    default 0;
}
# 根据指定的非正常响应码额外输出日志,便于和fail2ban等工具配合封禁可疑恶意ip
map $status $log_warn {
    # 针对所有4开头或者5开头的响应码,比如404,429,444,499等)
    # ~^[45] 1; 
    # 针对性更强,集中观察所有403,404,499,444
    ~^(403|404|499|444) 1; 
    default 0;
}
