        end

        -- 重要：location 级 access_by_lua 会覆盖 server 级 access_by_lua。
        -- 为避免搜索引擎拿到 200 的挑战页，这里对疑似 Google/Bing UA 再做一次验证。
        if ngx.var.sc_suspected_se_bot == "1" then
            local ip = ngx.var.remote_addr
            if not ip then
