# /www/server/nginx/conf/com_js_signed.conf
# version:2026-06-12
# 简介:一个基于 OpenResty（nginx + lua-nginx-module）实现的 JavaScript 的反爬挑战。
# 依赖：OpenResty 自带 lua-nginx-module
# 配套文档参考:README_js_challenge_signed.md
# 
# 使用说明：
# 在需要引入js挑战的网站配置(vhost下到站点专属配置) 中的server 块上下文通过include本文件。
# 可以通过com_basic.conf中通过include引用本配置,然后vhost配置中引用com_basic.conf的方式间接禁用本配置.
# 关于png,webp等类型的资源,com_basic.conf中有相关规则(包括将图片访问相关的日志输出到指定的日志文件,以及限流)
# 
# 此外:
# 1) 在 http { } 级别（nginx.conf 内）声明共享字典：
#      lua_shared_dict sc_token_store 10m;
# 2) 提供一个长随机密钥（32+ 长度），可通过：
#      - http {} 中：env SC_SECRET;
#      - 或在 server 块里：set $sc_secret "请替换为随机密钥";
#
# 核心思路：
# - 浏览器访问受保护页面时，如无有效签名 Cookie，则返回到 @challenge。
# - @challenge 用 Lua 生成短期签名 Token 写入 Cookie（绑定 UA，30 分钟过期）。
# - 普通脚本/爬虫难以重现签名；偷来的 Cookie 窗口短且与 UA 绑定，价值低。
# - 仍保留搜索引擎、社交爬虫、静态资源放行。

include /www/server/nginx/conf/com_secret.conf;

# ============================================
# 默认需要挑战：通过 server 级 access_by_lua 覆盖整站页面请求。
# 静态资源、内部挑战接口和白名单 UA 会在后续规则中放行。
# ============================================
set $need_challenge 1;

# 挑战结果标记：sc2 验签是否通过，默认 0，验签成功后置 1。
set $sc2_ok 0;

# ============================================
# 爬虫免挑战开关（修改入口：仅改此处 0/1，无需改动下方 UA 匹配块）。
# 取值含义：1=允许验证通过后免除 JS 挑战；0=视为普通访客，不进入搜索引擎反查，走后续正常流程。
# 适用范围：本文件 server 上下文，请求级变量，并发请求互不干扰。
# ============================================
set $allow_googlebot 1;
set $allow_bingbot 1;
set $allow_applebot 0; # 暂不开放applebot

# Google/Bing/Applebot 各自的中间命中标记（请求级变量，并发请求互不干扰）。
# 取值含义：0=该搜索引擎 UA 未命中，或对应 $allow_* 开关已关闭；1=UA 命中下方各自正则且开关允许。
# 引入原因：nginx 的 if 条件不支持单条逻辑与，无法一句表达“UA 命中且开关开启”，故分三步实现：
# UA 匹配置 1；开关为 0 时清零；为 1 时汇总置 $sc_suspected_se_bot=1。
# 约束效果：单个开关仅影响自身引擎；关闭后该类爬虫视为普通访客，不进入反查分支，不会因此返回 403。
set $hit_googlebot 0;
set $hit_bingbot 0;
set $hit_applebot 0;

# ============================================
# 疑似搜索引擎爬虫总标记（请求级变量，默认值为 0）通过反向dns验证bot真实性,待代替走js挑战。
# 也就是说,这个变量被设置为1的情况下(UA命中白名单bot),则不走js挑战,而是走dns检查(要么通过dns验证直接访问真实页面,要么不通过直接被403)
# 取值含义：0=不进入搜索引擎bot的ip的反向 DNS 验证，走后续正常流程(通常意味着走js挑战)；1=UA 命中且开关允许，必须进行反向 DNS 验证。
# 验证结果：验证通过则免除 JS 挑战；验证失败直接返回 403，不回落到挑战（仅凭 UA 不可信，需防伪造）。
# 注意：取值为 0 不等于一定进入挑战，静态资源、社交爬虫、AI 弱放行或有效 sc2 Cookie 仍可放行。
# ============================================
set $sc_suspected_se_bot 0;

# Google 采用宽松关键词匹配，以避免误伤 Google-InspectionTool 等业务爬虫。
# 下方三个 UA 匹配块分别写入各自 $hit_* 变量，理论上可以合并，分开书写是为了便于按搜索引擎独立维护。
# 如需关闭某类爬虫的免挑战，只需将其开关置 0，无需注释 UA 匹配块。
# if ($http_user_agent ~* "google") { # 宽松匹配简化.
if ($http_user_agent ~* "(Googlebot|Google-InspectionTool|Storebot-Google|GoogleOther|AdsBot-Google|Mediapartners-Google|FeedFetcher-Google|APIs-Google|Google-Read-Aloud|Chrome-Lighthouse|Google-Site-Verification)") {
    set $hit_googlebot 1;
}
if ($allow_googlebot = 0) {
    set $hit_googlebot 0;
}
if ($hit_googlebot = 1) {
    set $sc_suspected_se_bot 1;
}
# 对bing简单匹配即可
# if ($http_user_agent ~* "(Bingbot|BingPreview|msnbot|adidxbot)") {
if ($http_user_agent ~* "bing") {
    set $hit_bingbot 1;
}
if ($allow_bingbot = 0) {
    set $hit_bingbot 0;
}
if ($hit_bingbot = 1) {
    set $sc_suspected_se_bot 1;
}
# Applebot 官方建议使用 *.applebot.apple.com 反向 DNS，并确认正向 DNS 指回原 IP
# Applebot-Extended (apple ai相关爬虫)可通过robots.txt 设置声明.
if ($http_user_agent ~* "Applebot") {
    set $hit_applebot 1;
}
if ($allow_applebot = 0) {
    set $hit_applebot 0;
}
if ($hit_applebot = 1) {
    set $sc_suspected_se_bot 1;
}
# ============================================
# AI 爬虫弱校验放行（严格限速）
# 目标：允许常见 AI 爬虫抓取“几乎全站”，但避免被伪造 UA 获得高权限。
# 策略：
# - 仅 GET/HEAD 放行（POST 等仍走原逻辑/由应用处理）
# - 仅对非敏感路径放行（账户/结算/后台等仍保持挑战/拒绝）
# - 叠加严格限速（ai_limit）
# ============================================
set $is_ai_bot 0;
set $allow_ai_bot 1;
if ($http_user_agent ~* "(GPTBot|ChatGPT-User|OAI-SearchBot|OpenAI|PerplexityBot|ClaudeBot|Anthropic|cohere-ai|DuckAssistBot)") {
    set $is_ai_bot 1;
}
# 敏感路径：即使是 AI bot 也不弱放行（仍保留挑战/拒绝）
set $ai_allow 0;
if ($is_ai_bot = 1) {
    # 默认允许ai爬虫
    set $ai_allow 1;
}
# 对于敏感路径,则不允许ai爬虫(主要是防伪装的,虽然其他配置文件已经阻止了常见的敏感路径)
if ($request_uri ~* "^/(wp-admin/|wp-login\.php|xmlrpc\.php|account/|my-account/|cart/|checkout/)") {
    set $ai_allow 0;
}

# AI bot 只对 GET/HEAD 弱放行
if ($request_method !~ ^(GET|HEAD)$) {
    set $ai_allow 0;
}

# AI 总开关关闭时，一律不弱放行，直接走后续挑战流程。
if ($allow_ai_bot = 0) {
    set $ai_allow 0;
}

# 开启弱放行：仅将 need_challenge 置 0 (建议叠加限速)
if ($ai_allow = 1) {
    set $need_challenge 0;
}


access_by_lua_block {
    if ngx.var.need_challenge ~= "1" then
        return
    end

    local uri = ngx.var.uri or "/"
    if uri == "/__sc_verify" or uri == "/_sc/challenge" then
        return
    end

    if ngx.var.sc_suspected_se_bot == "1" then
        local ip = ngx.var.remote_addr
        if not ip then
            ngx.header["X-SC-Block"] = "unverified_bot_no_ip"
            ngx.header["X-Robots-Tag"] = "noindex"
            return ngx.exit(403)
        end

        local dict = ngx.shared.sc_bot_cache
        local cache_key = "vbot:" .. ip
        if dict then
            local v = dict:get(cache_key)
            if v == "1" then
                ngx.var.need_challenge = "0"
                return
            elseif v == "0" then
                ngx.header["X-SC-Block"] = "unverified_bot_cache"
                ngx.header["X-Robots-Tag"] = "noindex"
                return ngx.exit(403)
            end
        end

        local resolver = require "resty.dns.resolver"
        local r, err = resolver:new({
            nameservers = { "1.1.1.1", "8.8.8.8" },
            retrans = 2,
            timeout = 2000,
        })
        if not r then
            if dict then dict:set(cache_key, "0", 60) end
            ngx.header["X-SC-Block"] = "unverified_bot_dns_init"
            ngx.header["X-Robots-Tag"] = "noindex"
            return ngx.exit(403)
        end

        local function ends_with(s, suffix)
            return s and suffix and #s >= #suffix and s:sub(-#suffix) == suffix
        end

        local function resolve_ptr(ipaddr)
            local ans, e = r:reverse_query(ipaddr)
            if not ans then
                return nil
            end
            for _, rr in ipairs(ans) do
                if rr.type == r.TYPE_PTR and rr.ptrdname then
                    return rr.ptrdname
                end
            end
            return nil
        end

        local function forward_has_ip(name, ipaddr)
            local ans, e = r:query(name, { qtype = r.TYPE_A })
            if ans then
                for _, rr in ipairs(ans) do
                    if rr.address == ipaddr then
                        return true
                    end
                end
            end
            local ans6, e6 = r:query(name, { qtype = r.TYPE_AAAA })
            if ans6 then
                for _, rr in ipairs(ans6) do
                    if rr.address == ipaddr then
                        return true
                    end
                end
            end
            return false
        end

        local ptr = resolve_ptr(ip)
        if not ptr then
            if dict then dict:set(cache_key, "0", 300) end
            ngx.header["X-SC-Block"] = "unverified_bot_no_ptr"
            ngx.header["X-Robots-Tag"] = "noindex"
            return ngx.exit(403)
        end
        ptr = (ptr:gsub("%.$", ""))
        ngx.header["X-SC-PTR"] = ptr

        local ua = ngx.var.http_user_agent or ""
        local ual = string.lower(ua)
        local ok = false

        local is_google = (ual:find("google", 1, true) ~= nil) or (ual:find("lighthouse", 1, true) ~= nil)
        local is_bing = (ual:find("bing", 1, true) ~= nil) or (ual:find("msn", 1, true) ~= nil)
        local is_applebot = (ual:find("applebot", 1, true) ~= nil)

        if is_google then
            if ends_with(ptr, "googlebot.com") or ends_with(ptr, "google.com") or ends_with(ptr, "googleusercontent.com") then
                ok = forward_has_ip(ptr, ip)
            end
        elseif is_bing then
            if ends_with(ptr, "search.msn.com") then
                ok = forward_has_ip(ptr, ip)
            end
        elseif is_applebot then
            if ends_with(ptr, "applebot.apple.com") then
                ok = forward_has_ip(ptr, ip)
            end
        else
            if ends_with(ptr, "googlebot.com") or ends_with(ptr, "google.com") or ends_with(ptr, "googleusercontent.com") then
                ok = forward_has_ip(ptr, ip)
            elseif ends_with(ptr, "search.msn.com") then
                ok = forward_has_ip(ptr, ip)
            elseif ends_with(ptr, "applebot.apple.com") then
                ok = forward_has_ip(ptr, ip)
            end
        end

        if dict then
            dict:set(cache_key, ok and "1" or "0", ok and 21600 or 600)
        end
        if ok then
            ngx.var.need_challenge = "0"
            return
        end

        ngx.header["X-SC-Block"] = "unverified_bot"
        ngx.header["X-Robots-Tag"] = "noindex"
        return ngx.exit(403)
    end

    local function deny(reason)
        local m = ngx.req.get_method()
        if m == "GET" or m == "HEAD" then
            local u = ngx.var.request_uri or "/"
            -- Always enter the public challenge endpoint. This avoids edge cases
            -- where an internal ngx.exec("@challenge") from access phase returns
            -- 500 on some OpenResty/nginx builds.
            return ngx.redirect("/_sc/challenge?u=" .. ngx.escape_uri(u), 302)
        end
        return ngx.exit(403)
    end

    local cookie = ngx.var.http_cookie or ""
    local c = cookie:match("^%s*sc2=([^;]+)") or cookie:match(";%s*sc2=([^;]+)")
    if not c then
        return deny("no_cookie")
    end

    c = c:gsub("^%s+", ""):gsub("%s+$", "")
    c = c:gsub('^"', ""):gsub('"$', "")

    local ts, nonce, mac = c:match("^(%d+)_([0-9a-fA-F]+)_([0-9a-fA-F]+)$")
    if not ts then
        return deny("bad_format")
    end

    if #mac ~= 32 or #nonce < 6 or #nonce > 32 then
        return deny("bad_format")
    end

    ts = tonumber(ts)
    local now = ngx.time()
    if not ts or (now - ts) > 1800 or (ts - now) > 300 then
        return deny("expired")
    end

    local secret = ngx.var.sc_secret or os.getenv("SC_SECRET")
    if not secret or #secret < 16 then
        return deny("no_secret")
    end

    local data = secret .. "|" .. ts .. "|" .. nonce .. "|" .. (ngx.var.http_user_agent or "")
    local expected = ngx.md5(data)
    if expected ~= string.lower(mac) then
        return deny("mac_mismatch")
    end

    ngx.var.need_challenge = "0"
    ngx.var.sc2_ok = "1"
}

# 社交媒体爬虫
if ($http_user_agent ~* "(facebookexternalhit|Twitterbot|LinkedInBot|Pinterest|WhatsApp|TelegramBot|Discordbot)") {
    set $need_challenge 0;
}

# 支付/监控服务
if ($http_user_agent ~* "(PayPal|Stripe|Shopify|UptimeRobot|Pingdom)") {
    set $need_challenge 0;
}

# WordPress 内部请求 (Loopback/Cron 等) 放行
if ($http_user_agent ~* "WordPress") {
    set $need_challenge 0;
}


# ============================================
# 敏感备份/归档文件探测：不要按普通静态资源放行
# ============================================
location ~* /(?:backup|backups|bak|old|tmp|temp|database|db|dump|dumps|archive|archives)(?:/|[^/]*\.(?:sql|zip|tar\.gz|tgz|rar|7z|xz|zst|bak)$) {
    add_header X-SC-Block "sensitive_archive";
    return 403;
}


# ============================================
# 图片资源跳过验证
# ============================================
location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
    set $need_challenge 0;
    # expires 指令用来设置 HTTP 响应头中的缓存过期时间（Cache-Control 或 Expires header），
    # 告诉浏览器或代理服务器在多长时间内可以 使用本地缓存的资源，而不需要重新向服务器请求。
    expires 30d; 
    
    # 针对图片爬虫的专用日志文件(可供配合fail2ban)
    access_log /www/wwwlogs/imgs.log combined;
    # access_log off;
}

# 其他静态资源
location ~* \.(js|css|woff|woff2|ttf|eot|mp4|mp3|pdf)$|robots.txt$ {
    set $need_challenge 0;
    # expires 指令用来设置 HTTP 响应头中的缓存过期时间（Cache-Control 或 Expires header），
    # 告诉浏览器或代理服务器在多长时间内可以 使用本地缓存的资源，而不需要重新向服务器请求。
    expires 30d; 
    # 默认关闭这类日志
    access_log off;
}


# ============================================
# 兼容旧版显式保护路径。
# 说明：整站保护已在上面的 server 级 access_by_lua 中完成；这里保留这些
# 路径的 location，是为了不改变旧配置中对 WooCommerce 常见路径的 try_files 行为。
# ============================================
location ~ ^/(product|shop|category|cart|checkout|account|admin){
# location ~ ^/(category|cart|checkout|account|admin){
    access_by_lua_block {
        if ngx.var.need_challenge ~= "1" then
