# 格式：
# 域名                      后端地址;
#
# 注意：
# 1. 每行末尾必须有分号。
# 2. 后端格式必须和 update_repos_vps.sh --proxy-pass-mode 一致:
#      url (hostmap 默认):  http://10.10.0.11:80
#      hostport:            10.10.0.11:80
#    当前部署模式见 ../proxy-pass-mode （没有该文件则按 url）。
# 3. 这里不要写 map { } 外壳，只写映射条目。
# 4. 如果一个根域和所有子域都走同一后端，可以用 .example.com。

# 例如:
# domain-a1-1.com              http://10.10.0.11:80;
# www.domain-a1-1.com          http://10.10.0.11:80;

# 或者如果一个根域和所有子域都走同一后端,可以简化:
# .domain-a1-1.com             http://10.10.0.11:80;